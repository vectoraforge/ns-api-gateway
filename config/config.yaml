log_level: INFO
model:
  name: gpt-4o-mini
  temperature: 0.3
  max_tokens: 1000
resilience:
  pool_size: 5
  queue_size: 25
  queue_retry_after_seconds: 2
  timeout_seconds: 30
  retry_max_attempts: 3
  retry_backoff_base_seconds: 0.5
  retry_backoff_max_seconds: 4
  circuit_breaker_failure_threshold: 5
  circuit_breaker_reset_seconds: 60
jwt:
  jwks_cache_ttl_seconds: 3600
auth:
  subject_hash_key: "${AUTH_SUBJECT_HASH_KEY}"
  subject_hash_key_version: 1
chats_limit: 50
messages_limit: 50
apple:
  environment: sandbox
  bundle_id: com.example.nativespeaker
  enable_online_checks: true
  product_id_to_plan:
    com.example.nativespeaker.silver: silver
    com.example.nativespeaker.gold: gold
    com.example.nativespeaker.platinum: platinum
quotas:
  free: 10
  silver: 50
  gold: 200
  platinum: 1000

# The access tiers and their monthly credit limits, product configuration written into
# `core.access_tiers` at startup. The key is the stable tier id grants and subscriptions point
# at; a custom tier is one more entry here, never a per-user credit override. Every registered
# tier sits at or above the anonymous tier's allowance, and a catalogue that breaks that is
# refused at startup.
# [impl->req~schema-access-tiers-registered-ge-anonymous~1]
access_tiers:
  anonymous:
    tier_class: anonymous
    monthly_credits: 10
  free:
    tier_class: registered
    monthly_credits: 10
  silver:
    tier_class: registered
    monthly_credits: 50
  gold:
    tier_class: registered
    monthly_credits: 200
  platinum:
    tier_class: registered
    monthly_credits: 1000

# The limits Envoy enforces. Declared here because the application configuration file is the
# source of truth for every limit; the backend evaluates none of them.
gateway_rate_limits:
  upgrade_anonymous:
    route: "POST /auth/upgrade-anonymous"
    limit: "3/hour"
    key: "issuer+subject_hash"
    evaluate_after: "envoy_jwt_verification"
  # Gateway limiting on the pre-auth create-user route is required on every deployment: both
  # entries cover its prepare and complete phases, and neither is optional. Both are counters in
  # the global rate-limit service every Envoy replica shares, never per-pod counters, and both
  # fail closed.
  # [impl->req~sessions-create-user-gateway-limit-required~1]
  # [impl->req~sessions-create-user-two-gateway-limits~1]
  # The per-client-IP ceiling, keyed on the canonical client address and loose enough for
  # legitimate users sharing one NAT egress address.
  # [impl->req~sessions-create-user-per-ip-limit~1]
  # [impl->req~sessions-client-ip-primary-key-on-create-user~1]
  create_user_ip:
    route: "POST /auth/create-user"
    limit: "10/minute"
    key: "ip"
    evaluate_after: "gateway_route_match"
    enforcement: global_rate_limit_service
    phases: ["prepare", "complete"]
    failure_mode: fail_closed
  # The deployment-wide ceiling across all source addresses. This is the bound on total account
  # creation, and its sustained saturation is the anomaly signal an operator is alerted on.
  # [impl->req~sessions-create-user-deployment-wide-limit~1]
  # [impl->req~sessions-create-user-limit-tuning-and-alert~1]
  create_user_deployment:
    route: "POST /auth/create-user"
    limit: "100/minute; 2000/day"
    key: "deployment"
    evaluate_after: "gateway_route_match"
    enforcement: global_rate_limit_service
    phases: ["prepare", "complete"]
    failure_mode: fail_closed
    saturation_alert: true

# The backend-to-provider damping limits every adapter runs under, so provider outages, retries
# and replay attempts cannot fan out unbounded calls. These are the second layer: they protect
# the provider integrations and the backend's credentials, and never stand in for the endpoint
# limits below.
# [impl->req~ratelimit-adapter-damping-limits-configured~1]
# [impl->req~ratelimit-adapter-limits-second-layer~1]
provider_damping:
  # A fixed per-attempt timeout on every completion-path provider call bounds the worst case of
  # the steps after the operation challenge is claimed.
  # [impl->req~ratelimit-provider-attempt-timeouts~1]
  firebase_lookup:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 5
    total_budget_seconds: 10
    max_attempts: 2
    retry_budget: 1
  devicecheck_read:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 5
    total_budget_seconds: 10
    max_attempts: 2
    retry_budget: 1
  devicecheck_write:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 5
    total_budget_seconds: 10
    max_attempts: 1
    retry_budget: 1
  play_integrity_verify:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 5
    total_budget_seconds: 10
    max_attempts: 2
    retry_budget: 1
  device_recall_read:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 5
    total_budget_seconds: 10
    max_attempts: 2
    retry_budget: 1
  device_recall_write:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 5
    total_budget_seconds: 10
    max_attempts: 1
    retry_budget: 1
  # The web gate's Cloudflare `siteverify` call, budgeted fail-closed in its recommended shape.
  # [impl->req~ratelimit-turnstile-siteverify-fail-closed-budget~1]
  turnstile_siteverify:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 2
    total_budget_seconds: 3.5
    max_attempts: 2
    retry_budget: 2
    retry_on: [connection_failure, http_429, http_5xx, cloudflare_internal_error]
    failure_mode: fail_closed
  # Live store-state verification carries no retry budget at all: exactly one outbound call per
  # restore request, owned by 04-subscription-restore-and-entitlement-transfer.md.
  # [impl->req~ratelimit-per-request-provider-retry-budget~1]
  apple_live_store_verification:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 8
    total_budget_seconds: 8
    max_attempts: 1
    retry_budget: null
    freshness_seconds: 60
  google_play_live_store_verification:
    connect_timeout_ms: 500
    attempt_timeout_seconds: 8
    total_budget_seconds: 8
    max_attempts: 1
    retry_budget: null
    freshness_seconds: 60

# Every backend rate limit and admission control. The recommended values shipped here are
# initial deployment policy; this file remains the source of truth.
# [impl->req~ratelimit-config-shape-and-defaults~1]
# [impl->req~ratelimit-recommended-values-are-initial-policy~1]
# [impl->req~ratelimit-all-limits-in-config-no-hardcoding~1]
rate_limits:
  # [impl->req~ratelimit-config-key-enabled~1]
  enabled: true
  # Shared Redis or Valkey in production, so counters apply across all backend replicas.
  # [impl->req~ratelimit-config-key-storage-uri~1]
  # [impl->req~ratelimit-shared-storage-in-production~1]
  storage_uri: "${RATE_LIMIT_STORAGE_URI}"
  # [impl->req~ratelimit-config-key-strategy~1]
  strategy: moving-window
  environment: "${APP_ENVIRONMENT}"
  # The canonical client address, and the trusted-proxy chain it is resolved through. This
  # deployment terminates client connections at Envoy itself, so the key is the direct
  # downstream socket address, no forwarded address is trusted, `xff_num_trusted_hops` is 0, and
  # Envoy is the documented component that establishes the true client address. A deployment that
  # puts a load balancer in front of Envoy names it under `trusted_proxies` and `injector`, and
  # the hop count then follows from that list.
  # [impl->req~sessions-client-ip-trusted-proxy-chain~1]
  # [impl->req~sessions-client-ip-direct-downstream~1]
  # [impl->req~sessions-client-ip-deployment-documents-injector~1]
  client_address:
    # IPv4 keys on the full address; IPv6 buckets by this prefix, tightened only if abuse appears.
    # [impl->req~sessions-client-ip-ipv6-prefix-bucket~1]
    ipv6_prefix: 64
    # The one shared unresolved-address bucket runs at the single-address ceiling.
    # [impl->req~sessions-client-ip-unresolved-bucket~1]
    unresolved_limit: "10/minute"
    source: envoy_direct_downstream
    trusted_proxies: []
    injector: envoy_direct_downstream_socket
    # The outermost trusted hop overwrites inbound forwarding headers rather than appending.
    # [impl->req~sessions-client-ip-outermost-hop-overwrites~1]
    overwrite_inbound_forwarding_headers: true
  # [impl->req~ratelimit-config-key-default~1]
  default:
    limit: "120/minute"
    key: "ip"
    failure_mode: fail_closed
  auth_sync:
    limit: "60/minute"
    key: "issuer+subject_hash"
  users_me:
    limit: "30/minute"
    key: "issuer+subject_hash"
  create_user_prepare:
    limit: "10/minute"
    key: "ip"
  create_user:
    limit: "10/minute"
    key: "ip"
  create_user_firebase_identity_lookup:
    limit: "60/minute"
    key: "deployment"
    failure_mode: fail_closed
  create_user_firebase_identity_lookup_ip:
    limit: "10/minute"
    key: "ip"
    failure_mode: fail_closed
  upgrade_anonymous_prepare:
    limit: "5/minute; 20/hour"
    key: "ip+issuer+subject_hash"
  upgrade_anonymous_to_registered_firebase_identity_lookup:
    limit: "3/minute; 10/hour"
    key: "deployment+firebase_project_id+issuer+subject_hash"
    failure_mode: fail_closed
  claim_anonymous_grant_prepare:
    limit: "5/minute; 20/hour"
    key: "user"
  claim_anonymous_grant_prepare_ip:
    limit: "10/minute; 60/hour"
    key: "ip"
  claim_anonymous_grant:
    limit: "2/minute; 6/hour; 20/day"
    key: "user"
  claim_anonymous_grant_ip:
    limit: "10/minute; 30/hour; 100/day"
    key: "ip"
  claim_registered_grant_prepare:
    limit: "5/minute; 20/hour"
    key: "user"
  claim_registered_grant:
    limit: "2/minute; 6/hour; 20/day"
    key: "user+idp_account_hash"
  restore_subscription_user:
    limit: "10/day"
    key: "user"
  restore_subscription_subject:
    limit: "20/day"
    key: "issuer+subject_hash"
  restore_subscription_proof_fingerprint_failed:
    limit: "5/hour"
    key: "restore_proof_fingerprint"
  restore_subscription_proof_fingerprint_total:
    limit: "20/day"
    key: "restore_proof_fingerprint"
  restore_subscription_store_subscription_cross_account:
    limit: "3/hour"
    key: "provider+external_id"
  restore_subscription_store_subscription_live_verification:
    limit: "1/minute"
    key: "provider+external_id"
  restore_subscription_destination_rejected_cross_account:
    limit: "3/day"
    key: "user"
  quota_checked_request:
    limit: "120/minute"
    key: "user"
  adapter_play_integrity_verify:
    limit: "60/minute"
    key: "deployment+package_name"
  adapter_devicecheck_read:
    limit: "30/minute"
    key: "deployment+apple_team_id"
    failure_mode: fail_closed
  adapter_devicecheck_write:
    limit: "20/minute"
    key: "deployment+apple_team_id"
    failure_mode: fail_closed
  adapter_play_integrity_device_recall_read:
    limit: "30/minute"
    key: "deployment+package_name"
    failure_mode: fail_closed
  adapter_play_integrity_device_recall_write:
    limit: "20/minute"
    key: "deployment+package_name"
    failure_mode: fail_closed
  adapter_cloudflare_turnstile_siteverify:
    limit: "60/minute"
    key: "deployment"
    failure_mode: fail_closed
  adapter_firebase_lookup:
    limit: "30/minute"
    key: "deployment+firebase_project_id"
  adapter_apple_store_status:
    limit: "30/minute"
    key: "deployment+bundle_id"
  adapter_google_play_subscription_status:
    limit: "30/minute"
    key: "deployment+package_name"
  provider_apple_store_live_verification_global:
    limit: "300/minute"
    key: "deployment"
  provider_google_play_live_verification_global:
    limit: "300/minute"
    key: "deployment"