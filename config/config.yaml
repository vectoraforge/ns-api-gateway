log_level: INFO
model:
  name: gpt-4o-mini
  temperature: 0.3
  max_tokens: 1000
resilience:
  pool_size: 5
  queue_size: 25
  queue_retry_after_seconds: 2
  timeout_seconds: 30
  retry_max_attempts: 3
  retry_backoff_base_seconds: 0.5
  retry_backoff_max_seconds: 4
  circuit_breaker_failure_threshold: 5
  circuit_breaker_reset_seconds: 60
jwt:
  jwks_cache_ttl_seconds: 3600
# HMAC key material for the §4.3 / §6.4 keyed subject hashes. Base64 text, decoded to bytes once
# at configuration load (pinned by the phase 35 checkpoint; changing the encoding after any row
# exists invalidates every stored hash, and the raw subject was never kept).
#
# THIS FILE IS TRACKED IN GIT (D-20, accepted). The keys below are therefore committed, and
# rotating one leaves its predecessor readable in history for good. These are generated
# development keys -- provision production material through
# .planning/todos/pending/secret-manager-integration.md, which exists for this reason.
#
# The YAML is authoritative for anything it declares: AppConfig is built as AppConfig(**yaml_data,
# ...) and pydantic-settings ranks init_settings above env_settings, so no environment variable
# can override a key declared here. The Secret Manager follow-up must REMOVE these entries, not
# shadow them.
#
chats_limit: 50
messages_limit: 50