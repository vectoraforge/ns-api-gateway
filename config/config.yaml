log_level: INFO
model:
  name: gpt-4o-mini
  temperature: 0.3
  max_tokens: 1000
resilience:
  pool_size: 5
  queue_size: 25
  queue_retry_after_seconds: 2
  timeout_seconds: 30
  retry_max_attempts: 3
  retry_backoff_base_seconds: 0.5
  retry_backoff_max_seconds: 4
  circuit_breaker_failure_threshold: 5
  circuit_breaker_reset_seconds: 60
# One connection per request at a time, and none held across the provider call, so this bounds
# short database work only. The relation to resilience above is this comment, not code.
db:
  pool_size: 12
jwt:
  jwks_cache_ttl_seconds: 3600
# NO SECRET MATERIAL LIVES IN THIS FILE. It is tracked in git (D-20, accepted), so it carries only
# public reference data: the levels and limits above, and the two store product maps below. Every
# credential is an environment variable or a path to a file kept outside this repository -- see
# .env.example. There is no keyed subject hash anywhere in this project either; the verified
# pre-auth subject is stored in plaintext, as the core.auth_challenges column comment says.
#
# The YAML is authoritative for anything it declares: AppConfig is built as AppConfig(**yaml_data,
# ...) and pydantic-settings ranks init_settings above env_settings, so no environment variable
# can override a key declared here. Add a key below only when it must NOT vary per deployment.
#
# An operator edits this map; a verified product id absent from it is a 500 and Apple's next retry succeeds.
app_store:
  products:
    com.nativespeaker.subscription.monthly: paid
# The same map for Google. An unmapped verified product id is a 500 and Pub/Sub redelivers.
google_play:
  products:
    nativespeaker.subscription.monthly: paid
chats_limit: 50
messages_limit: 50
