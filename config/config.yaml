log_level: INFO
model:
  name: gpt-4o-mini
  temperature: 0.3
  max_tokens: 1000
resilience:
  pool_size: 5
  queue_size: 25
  queue_retry_after_seconds: 2
  timeout_seconds: 30
  retry_max_attempts: 3
  retry_backoff_base_seconds: 0.5
  retry_backoff_max_seconds: 4
  circuit_breaker_failure_threshold: 5
  circuit_breaker_reset_seconds: 60
jwt:
  jwks_cache_ttl_seconds: 3600
chats_limit: 50
messages_limit: 50
apple:
  environment: sandbox
  bundle_id: com.example.speaknative
  enable_online_checks: true
  cert_dir: certs/
  product_id_to_tier:
    com.example.speaknative.silver: silver
    com.example.speaknative.gold: gold
    com.example.speaknative.platinum: platinum