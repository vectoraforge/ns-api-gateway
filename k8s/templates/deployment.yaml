apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ns-api-gateway.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ns-api-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ns-api-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ns-api-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.serviceAccountName }}
      # The Workload-Identity route to Application Default Credentials: an unset value leaves the
      # pod with no Google identity at all.
      serviceAccountName: {{ . }}
      {{- end }}
      # The Restricted Pod Security Standard's baseline.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # The mounted DeviceCheck key is owned by root, so without this it mounts unreadable to
        # the uid above and the claim fails closed as if the key were absent.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          allowPrivilegeEscalation: false
          # Nothing the process writes lives on the root filesystem: the scratch mount below
          # covers the temporary files the provider libraries expect.
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # `required` on both halves: an unset one renders `image: ":"`, which the API server
        # refuses with a message naming nothing.
        image: "{{ required "image.repository must be set" .Values.image.repository }}:{{ required "image.tag must be set" .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.container.port }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            # By name, as `service.yaml` targets it: a literal duplicated `container.port`, and an
            # install that moved the port left both probes dialling the old one.
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # `required` for the same reason as `image.tag` above: without this Secret the pod
        # CrashLoopBackOffs on a pydantic ValidationError rather than failing at render.
        envFrom:
        - secretRef:
            name: {{ required "credentials.secretName must name a Secret carrying DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, JWT_PROJECT_ID and OPENAI_API_KEY" .Values.credentials.secretName }}
        env:
        # Set unconditionally: with no Secret named there is no file at this path, which
        # `read_private_key` reads as the absent key `values.yaml` documents.
        - name: DEVICECHECK_PRIVATE_KEY_PATH
          value: /etc/ns/devicecheck/{{ .Values.credentials.deviceCheckKey }}
        {{- if .Values.credentials.googleCredentialsSecretName }}
        # The file route to Application Default Credentials, set by the chart for the same reason:
        # the path has to name the mount below.
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /etc/ns/google/{{ .Values.credentials.googleCredentialsKey }}
        {{- end }}
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        {{- if .Values.credentials.deviceCheckSecretName }}
        - name: devicecheck
          mountPath: /etc/ns/devicecheck
          readOnly: true
        {{- end }}
        {{- if .Values.credentials.googleCredentialsSecretName }}
        - name: google-credentials
          mountPath: /etc/ns/google
          readOnly: true
        {{- end }}
        # The one writable path, because `readOnlyRootFilesystem` above leaves none otherwise.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.credentials.deviceCheckSecretName }}
      - name: devicecheck
        secret:
          secretName: {{ .Values.credentials.deviceCheckSecretName }}
          items:
          - key: {{ .Values.credentials.deviceCheckKey }}
            path: {{ .Values.credentials.deviceCheckKey }}
          # Owner root, group `fsGroup`: readable by the process and by no other mode bit.
          defaultMode: 0440
      {{- end }}
      {{- if .Values.credentials.googleCredentialsSecretName }}
      - name: google-credentials
        secret:
          secretName: {{ .Values.credentials.googleCredentialsSecretName }}
          items:
          - key: {{ .Values.credentials.googleCredentialsKey }}
            path: {{ .Values.credentials.googleCredentialsKey }}
          defaultMode: 0440
      {{- end }}
