apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ns-api-gateway.fullname" . }}-webhook-routes
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ns-api-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    {{- with .Values.gateway.namespace }}
    namespace: {{ . }}
    {{- end }}
  # Both paths are outside the JWT SecurityPolicy. Envoy cannot verify a store-signed token.
  # Apple sends no Authorization header. The signed payload is the only credential.
  # Google sends `Authorization: Bearer <OIDC token>`. That header must reach the backend
  # unchanged, because it is the only credential of the Google route.
  rules:
  - matches:
    - path:
        type: Exact
        value: /webhooks/app-store
      method: POST
    - path:
        type: Exact
        value: /webhooks/google-play/rtdn
      method: POST
    backendRefs:
    - name: {{ include "ns-api-gateway.fullname" . }}
      port: {{ .Values.service.port }}
