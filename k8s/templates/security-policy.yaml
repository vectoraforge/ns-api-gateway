apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "ns-api-gateway.fullname" . }}-jwt-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ns-api-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "ns-api-gateway.fullname" . }}-app-routes
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "ns-api-gateway.fullname" . }}-llm-routes
  jwt:
    providers:
    - name: firebase
      issuer: {{ .Values.jwt.issuer | quote }}
      remoteJWKS:
        uri: {{ .Values.jwt.jwksUri | quote }}
      claimToHeaders:
      - claim: plan
        header: x-user-plan
