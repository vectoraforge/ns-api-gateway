apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "ns-api-gateway.fullname" . }}-rate-limit
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ns-api-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "ns-api-gateway.fullname" . }}-llm-routes
  rateLimit:
    local:
      # One rule, no `clientSelectors`: every POST /chats shares one bucket per Envoy pod.
      # The four tier buckets this replaces selected on `x-user-plan`, a header nothing ever set
      # from the token and any client could send, so the caller chose its own bucket or none and
      # the limit never fired. The monthly allowance stays where it is enforceable: the backend
      # charges it per grant, and the execution gate caps in-flight work.
      rules:
      - limit:
          requests: {{ .Values.rateLimits.burst.requests }}
          unit: {{ .Values.rateLimits.burst.unit }}
  responseOverride:
  - match:
      statusCodes:
      - type: Value
        value: 429
    response:
      contentType: application/json
      body:
        type: Inline
        inline: '{"code":"quota_exceeded"}'
