apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ns-api-gateway.fullname" . }}-auth-routes
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ns-api-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
  # Under the JWT SecurityPolicy, as app-routes and llm-routes are. Every route here carries a
  # Firebase ID token, the pre-auth-callable ones included: an unlinked caller still presents a
  # verified token, and the unlinked decision stays in the backend barrier.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth
    - path:
        type: Exact
        value: /
    backendRefs:
    - name: {{ include "ns-api-gateway.fullname" . }}
      port: {{ .Values.service.port }}
