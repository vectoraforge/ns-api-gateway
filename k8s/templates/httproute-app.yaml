apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ns-api-gateway.fullname" . }}-app-routes
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ns-api-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /chats
    - path:
        type: PathPrefix
        value: /users
    - path:
        type: PathPrefix
        value: /examples
    backendRefs:
    - name: {{ include "ns-api-gateway.fullname" . }}
      port: {{ .Values.service.port }}
