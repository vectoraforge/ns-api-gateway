replicaCount: 1
namespace: native-speaker

# The ServiceAccount the pod runs as. Empty means the namespace's `default`, which carries no
# Workload Identity annotation, so `google.auth.default()` finds no metadata-server identity and
# Firebase Admin and the Play read both have none. Set this, or `credentials.googleCredentials*`
# below: Application Default Credentials has exactly these two routes, and the deployment needs one.
serviceAccountName: ""

image:
  # No default is possible for either, so the template declares both `required`: an install that
  # forgets `--set image.repository=... --set image.tag=...` fails rather than rendering `image: ":"`.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

container:
  port: 8000

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  # No `port`: both probes dial the container port by its name `http`, so `container.port` is the
  # one place the port is set and moving it cannot leave a probe on the old number.
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 30

gateway:
  name: eg-gateway

credentials:
  # The Secret carrying the six settings the process cannot boot without: DB_HOST, DB_PORT,
  # DB_USER, DB_PASSWORD, DB_NAME and JWT_PROJECT_ID. `config.py` gives none of them a default, so
  # an install without this Secret renders a pod that CrashLoopBackOffs on a pydantic
  # ValidationError. The template declares it `required`, as it does `image.tag`, so the omission
  # fails at render instead. Any other setting the deployment needs (OPENAI_API_KEY, the store and
  # DeviceCheck ids) belongs in the same Secret.
  secretName: ""
  # The Secret carrying the Apple DeviceCheck .p8. An environment variable cannot carry a file --
  # `DEVICECHECK_PRIVATE_KEY_PATH` is a path (`config.py:81`) and the adapter reads it from disk --
  # so the key is mounted and the template sets the path itself. Without it both free-grant claims
  # fail closed as 503 for the life of the deployment.
  deviceCheckSecretName: ""
  # The key inside that Secret, which is also the file name under the mount point.
  deviceCheckKey: devicecheck.p8
  # The Secret carrying an Application Default Credentials JSON, for a cluster with no
  # metadata-server identity. Leave it empty on GKE with Workload Identity, where the
  # `serviceAccountName` above is the whole answer. The same argument as the DeviceCheck key
  # applies: `GOOGLE_APPLICATION_CREDENTIALS` is a path, `readOnlyRootFilesystem` leaves nowhere
  # to write the file at runtime, so the chart mounts it and sets the path itself. Without either
  # route every account-creation route answers 503 for the life of the deployment.
  googleCredentialsSecretName: ""
  # The key inside that Secret, which is also the file name under the mount point.
  googleCredentialsKey: application_default_credentials.json

jwt:
  # No default is possible and an empty one is not checked, so the template declares it `required`:
  # an install that forgets `--set jwt.issuer=...` fails rather than shipping an unchecked issuer.
  issuer: ""
  jwksUri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"

env: []
