[project]
name = "ns-api-gateway"
version = "1.6.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "pydantic >=2.12",
    "pydantic-settings >=2.13",
    "pyyaml >=6.0",
    "orjson>=3.11",
    "langchain==1.2.13",
    "langchain-openai==1.1.11",
    "langchain-core==1.2.20",
    "openai >=2.21",
    "asyncpg >=0.30",
    "sqlmodel >=0.0.22",
    "greenlet >=3.0",
    "PyJWT[crypto]>=2.9.0",
    "ruff==0.15.7",
    "ty==0.0.24",
    "structlog>=25.5",
    "app-store-server-library>=3.0.0",
    "firebase-admin>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest >=9.0",
    "pytest-asyncio >=1.3",
    "pytest-cov >=7.0",
    "pytest-dotenv >=0.5",
    "httpx >=0.28",
    "ruff >=0.15.2",
    "ty >=0.0.17",
    "pogo-migrate>=0.4.2",
    "setuptools>=82.0.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nativespeaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env_files = [".env"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -m 'not e2e and not schema'"
markers = [
    "e2e: marks end-to-end tests requiring real infrastructure (deselect with -m 'not e2e')",
    "schema: marks schema-conformance tests requiring a real PostgreSQL (deselect with -m 'not schema')",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pogo]
migrations = './migrations'
database_config = 'postgres://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}'
schema = 'api'
