[project]
name = "sn-api-gateway"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi >=0.129",
    "uvicorn[standard] >=0.41",
    "pydantic >=2.12",
    "pydantic-settings >=2.13",
    "pyyaml >=6.0",
    "langchain >=1.2",
    "langchain-openai >=1.1",
    "langchain-core >=1.2",
    "openai >=2.21",
    "asyncpg >=0.30",
    "sqlmodel >=0.0.22",
    "greenlet >=3.0",
]

[dependency-groups]
dev = [
    "pytest >=9.0",
    "pytest-asyncio >=1.3",
    "pytest-cov >=7.0",
    "pytest-dotenv >=0.5",
    "httpx >=0.28",
    "ruff >=0.15.2",
    "ty >=0.0.17",
    "pogo-migrate>=0.4.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env_files = [".env"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -m 'not llm and not db'"
markers = [
    "llm: marks tests requiring calls to external LLM (deselect with -m 'not llm')",
    "db: marks tests requiring a real database (deselect with -m 'not db')",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pogo]
migrations = './migrations'
database_config = 'postgres://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}'
schema = 'api'